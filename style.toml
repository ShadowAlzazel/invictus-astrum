# Invictus: Astrum — how the map looks. Edit freely: the map picks up changes within seconds.
# Colours are #rrggbb. Nothing here changes the simulation.

[palette]
void    = "#07050f"   # background
violet  = "#7433fa"   # the interface: rings, hairlines, cursor
fuchsia = "#fa1f99"   # lock and selection only
ink     = "#e4def7"   # text
dim     = "#8a82a6"   # secondary text
orbit   = "#5b4a8f"   # orbit lines
cyan    = "#9ff0ff"   # bullseye plane and fields

# Affiliation is told by SHAPE first, colour second (APP-6 style frames).
# shape: rect | diamond | quatrefoil | square | circle; fill is the frame's fill opacity (0–1).
# tag: under a unit whose faction has no prefix of its own (AVC, AAG, JADF), what it is called instead.
[affiliation.friend]
label = "Friend"
tag   = "FRIEND"
shape = "rect"
color = "#e4def7"
fill  = 0.10

[affiliation.hostile]
label = "Hostile"
tag   = "HOSTILE"
shape = "diamond"
color = "#ff5a36"
fill  = 0.12

[affiliation.unknown]
label = "Unknown"
tag   = "UNKNOWN"
shape = "quatrefoil"
color = "#f5b82e"
fill  = 0.10

[affiliation.neutral]
label = "Civil / neutral"
tag   = "CIVIL"
shape = "square"
color = "#2ec4b6"
fill  = 0.10

# Status modifiers. dash: frame dash pattern [on, off] px; cross: strike through; opacity: 0–1;
# ellipse: draw an uncertainty ring.
[status.cold]
label = "Cold"
dash = [5, 3]

[status.track-lost]
label = "Track lost"
dash = [2, 3]
opacity = 0.7
ellipse = true

[status.crab]
label = "Crab: surrendered or disabled"
cross = true
opacity = 0.75

# Echelon marks drawn above a frame, smallest to largest.
[echelon]
ship       = ""

flight     = "||"
squadron   = "||"

group      = "|||"

flotilla   = "X"
task-force = "XX"
classis    = "XXX"
armada     = "XXXX"

# ---- formation roles: what a formation is for, built from blocks --------------------------------
# A formation's role is drawn inside its frame as one or more blocks, laid over each other: the
# APP-6 marks, read for this setting. Like a rating in the age of sail, a role is a composite: a
# forward escort is the forward block and the escort block. Ships keep their class's type.
#
# The blocks. draw is what the map draws (the APP-6 mark it was, in brackets):
#   oval     an ellipse in the middle                        (armour)
#   cross    corner to corner, both ways                     (infantry)
#   slash    one diagonal, lower left to upper right         (reconnaissance)
#   bar      a bar across the bottom                         (supply)
#   stroke   a stroke down the middle, top to bottom         (motorized)
#   chevron  an inverted V, the bottom corners to the top    (anti-armour)
#   dome     an arc standing on the bottom edge              (air defence)
#   bolt     a lightning bolt, upper left to lower right     (signal)
[formation_block]
battle  = { draw = "oval",    label = "Battle" }           # O
line    = { draw = "cross",   label = "Line" }             # X
picket  = { draw = "slash",   label = "Picket" }           # /
supply  = { draw = "bar",     label = "Supply" }           # _
forward = { draw = "stroke",  label = "Forward" }          # |
pd      = { draw = "chevron", label = "Point Defence" }    # /\
escort  = { draw = "dome",    label = "Escort" }           # the dome
signal  = { draw = "bolt",    label = "Signal" }           # the bolt

# The roles. blocks: what it is made of, drawn in that order. label: as its panel names it (left
# out, the blocks' labels: ["forward", "escort"] reads "Forward Escort"). words: callsign words or
# phrases that give a formation this role when it does not name one (role = "battle" in the
# scenario); the first in the callsign wins, the longer phrase where two start at the same word
# ("Forward Scout Squadron 1": forward-scout, not scout).
# To make one: a new [formation_role.<id>] with its blocks; to make a new block: a line above.
[formation_role.battle]
blocks = ["battle"]
words = ["Battle"]

[formation_role.line]
blocks = ["line"]
words = ["Line"]

[formation_role.picket]
label = "Picket, Reconnaissance"
blocks = ["picket"]
words = ["Picket"]

[formation_role.strike]
label = "Strike, Shock"
blocks = ["battle", "line"]
words = ["Strike"]

[formation_role.vanguard]
label = "Vanguard"
blocks = ["forward", "battle"]
words = ["Vanguard"]

[formation_role.escort]
label = "Escort, Point Defence"
blocks = ["pd", "escort"]
words = ["Escort"]

[formation_role.point-defence]
blocks = ["pd"]
words = ["PD"]

[formation_role.scout]
label = "Scout"
blocks = ["escort", "picket"]
words = ["Scout"]

[formation_role.relay]
label = "Relay, Communications"
blocks = ["escort", "signal"]
words = ["Relay"]

[formation_role.supply]
label = "Supply, Tender"
blocks = ["supply"]
words = ["Supply", "Tender"]

[formation_role.patrol]
label = "Patrol"
blocks = ["supply", "picket"]
words = ["Patrol"]

[formation_role.forward-scout]
label = "Forward Scout"
blocks = ["forward", "escort", "picket"]
words = ["Forward Scout"]

[formation_role.forward-escort]
blocks = ["forward", "escort"]
words = ["Forward Escort"]

# Bodies are drawn large by tactical role (size in px at display scale 1). 0 hides the display.
[roles.star]
size_px = 48
label = "Star"

[roles.orbis]
size_px = 40
label = "Inhabited world"

[roles.gas-giant]
size_px = 36
label = "Gas giant"

[roles.ice-giant]
size_px = 30
label = "Ice giant"

[roles.world]
size_px = 22
label = "World"

[roles.dwarf]
size_px = 14
label = "Dwarf planet"

[roles.moon]
size_px = 14
label = "Moon"

[roles.station]
size_px = 14
label = "Station"

[roles.barycenter]
size_px = 0
label = "Barycentre"

# Sizes, folding distances and selection behaviour live in display.toml.
