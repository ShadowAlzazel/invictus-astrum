# Ship AI automata (astrum/shipai): each a state map a combat profile names (profiles.toml
# `automaton`). A state says her quarters, her sensors, whether she engages, and where each event
# takes her; entering it gives the orders it says (quarters, active or passive), as a player would.
#
#   start     the state she starts in
#   quiet_h   a state's `quiet` event: this long with no hostile or bogey known in her sensor range
#   quarters  1 general quarters, 2 attack, 3 watching
#   sensors   "active" (ping: she finds cold hulls, and every sensor sees her) or "passive"
#   engage    whether she engages in it (her stance and profile say whom and how)
#   on        event -> state. threat: a hostile or a bogey known within her sensor range (seen by
#             her own sensors, reported to her side, or firing on her); quiet; attack: she is given
#             an attack-move, a patrol or an engage; done: no order left to fly

[automaton.default]
name = "Standing watch"
start = "watch"
quiet_h = 24

[automaton.default.state.watch]
label = "Watching"
quarters = 3
sensors = "passive"
on = { threat = "gq", attack = "attack" }

[automaton.default.state.attack]
label = "Moving to attack"
quarters = 2
on = { threat = "gq", done = "watch" }

[automaton.default.state.gq]
label = "General quarters"
quarters = 1
sensors = "active"
engage = true
on = { quiet = "watch" }
