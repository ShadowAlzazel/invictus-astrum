# A picture for the map, and the ships in it flown by the simulation (astrum/sim.py).
# Positions are AER from a bullseye, or carried with a body. `class` names a ship class in
# data/ships/classes; the unit becomes a ship: her symbol takes its type from the class, and the
# simulation reads her length, masses and drive from it.
#
# A ship may also say:
#   load = "light"         her ammunition load, one of her class's hull masses (else the heaviest)
#   propellant = 0.8       the share of her tanks she starts with (else full)
#   mode = "free"          fly from the start instead of holding station
#   hull_number = "BBC-382"  her pennant, shown beside her name
# Any unit takes its affiliation and its faction (data/factions.toml) from the formation above it,
# unless it states its own.
# A formation may say  role = "battle"  (style.toml [formation_role]: battle, line, picket, strike,
# vanguard, escort, point-defence, scout, relay, supply, patrol, forward-scout, forward-escort, each made of
# blocks); if it does not, a word of its callsign gives it ("Line Flotilla 1", "Forward Scout 2").
# Holding station is not free: she follows her place in the bullseye's frame and her tanks pay
# for every bit of it that is not an orbit. Orders ([[order]], at the end) make her fly.

[scenario]
id = "sol-demo"
name = "Cislunar picture"
system = "sol"
player = "arcvs"

