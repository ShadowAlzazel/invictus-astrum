# A scenario: a system, the fleets it brings in (data/fleets), the contacts of its own (the local
# picture), and the orders its ships fly once the clock runs (astrum/sim.py). Every unit is placed
# at its start. How a unit is written: data/fleets/README.md.

[scenario]
id = "sol-demo"
name = "Cislunar picture"
system = "sol"
player = "arcvs"
factions = ["arcvs", "jadf", "bandit", "ghost"]   # whose forces it holds: each a view of it (with MASTER, everything)

# ---- the fleets it brings in (data/fleets): placed at its start ---------------------------------------
[[fleet]]
id = "luna-classis-1"

[[fleet]]
id = "jupiter-home"

[[fleet]]
id = "ghost"

# ---- the local picture --------------------------------------------------------------------------------
[[contact]]
id = "g1"
callsign = "Single Group"
affiliation = "hostile"
faction = "bandit"
echelon = "squadron"
brevity = "bandit"
pry = 4
position = { bullseye = "burn", aer = [150, -40, 400000] }

[[contact]]
id = "b1"
callsign = "Bogey"
affiliation = "unknown"
echelon = "ship"
brevity = "bogey"
status = ["track-lost"]
position = { body = "moon", offset_km = [30000, -12000, 5000] }

[[contact]]
id = "c1"
callsign = "Civil transport"
affiliation = "neutral"
echelon = "ship"
brevity = "civil"
position = { body = "earth", offset_km = [-42164, 0, 0] }

[[contact]]
id = "x1"
callsign = "Crab"
affiliation = "hostile"
faction = "bandit"
echelon = "ship"
brevity = "crab"
status = ["crab"]
position = { bullseye = "burn", aer = [170, -35, 380000] }

# ---- orders: what ships do once the clock runs -------------------------------------------------------
# Every ship holds station unless ordered: she follows her place and pays the Δv it costs.
# A drive trial: L1 Picket A 1 runs out ahead of the wedge half an hour in, at 0.45 g for twenty
# minutes, then coasts. Remove it freely.
[[order]]
unit = "tf2-lf1-pa-1"
at_s = 1800                 # seconds after the scenario starts
burn = { g = 0.45, bullseye = "wedge", bearing = 0, elevation = 0, duration_s = 1200 }
