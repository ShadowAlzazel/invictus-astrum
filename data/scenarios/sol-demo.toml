# A scenario: a system; the fleets it loads (data/fleets) and where their units start (a [[contact]]
# with fleet and unit: position, mode, status...; a fleet's ships it does not place are undeployed);
# contacts of its own (GHOST, the local picture); and the orders its ships fly once the clock runs
# (astrum/sim.py). How units and placements are written: data/fleets/README.md.

[scenario]
id = "sol-demo"
name = "Cislunar picture"
system = "sol"
player = "arcvs"
factions = ["arcvs", "jadf", "bandit", "ghost"]   # whose forces it holds: each a view of it (with MASTER, everything)

# ---- the fleets it loads (data/fleets); its contacts below place their units -------------------------
[[fleet]]
id = "luna-classis-1"

[[fleet]]
id = "jupiter-home"


# ==== where luna-classis-1's units start =========================================================
# ---- friendly: one task force element, in flights, out of plane over Earth --------------------------
