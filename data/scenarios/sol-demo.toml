# ---- orders: what ships do once the clock runs -------------------------------------------------------
# Every ship holds station unless ordered: she follows her place and pays the Δv it costs.
# A drive trial: L1 Picket A 1 runs out ahead of the wedge half an hour in, at 0.45 g for twenty
# minutes, then coasts. Remove it freely.
[[order]]
unit = "tf2-lf1-pa-1"
at_s = 1800                 # seconds after the scenario starts
burn = { g = 0.45, bullseye = "wedge", bearing = 0, elevation = 0, duration_s = 1200 }
