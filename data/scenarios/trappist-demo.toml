# TRAPPIST-1: Luna Classis I's Task Force 3 on free orbits about TRAPPIST-1 f, and its Luna Strike
# Squadron on free orbits about the star, half an AU out. The rest of the Classis is undeployed, its
# flagship (Imoogi, with Task Force 1) among them: the Classis leads by its next ship in the chain of
# command, Task Force 3's (astrum/relay.py). How units and placements are written: data/fleets/README.md.

[scenario]
id = "trappist-demo"
name = "Trappist picture"
system = "trappist-1"
player = "arcvs"
factions = ["arcvs"]

[[fleet]]
id = "luna-classis-1"

