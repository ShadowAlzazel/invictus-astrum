# The parts ships are built from. A class's battery names a component and says how many.
# Only what the canon states per part lives here; whole-battery figures (total power, salvo energy)
# live on the battery in the class file. A round's energy is derived (½mv²), never typed in.
#
# kind: spinal-channel | gun | panel | dome | strip | missile-cell | telescope | sensor

[component.nervvs-mk2]
name = "NERVVS Mk.2"
kind = "spinal-channel"
energy_gev = 19

