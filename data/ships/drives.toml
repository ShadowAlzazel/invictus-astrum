# Drive modules: the engines a class connects to with [drive] module = "<id>".
# Only the engine lives here. What it pushes (the hull's masses, the propellant it carries) lives on
# the class, so one module can serve several classes and a refit is a one-line change.
#
#   thrust_mn             the most thrust, at the pulse ceiling. A drive throttles down freely, never up.
#   exhaust_kms           exhaust velocity. Δv, propellant per Δv and the plume all follow from it:
#                         "1,000 t per 100 km/s at 90,000 t" is 100 / ln(90000 / 89000) ≈ 8,950 km/s.
#   pulse_rate_hz         the pulse ceiling that caps thrust (descriptive until the simulation needs it)
#   hull_heat_fraction    the share of jet power that comes back into the hull as heat. With the class's
#                         thermal store it gives how long she can burn flat out before the store is full.
#
# Every figure takes the registry's forms: 380, [360, 400], { value = 8950, est = true }, or "—".
# Names here are placeholders until the canon names the drives.

[drive.line-pulse]
name = "Line fusion pulse drive"
kind = "fusion-pulse"
thrust_mn = 380
exhaust_kms = 8950
pulse_rate_hz = 140
hull_heat_fraction = 0.00001
notes = "Thrust from PAPILION's canon: 70,340 t × 5.40 m/s² = 62,340 t × 6.09 m/s² ≈ 380 MN."

[drive.frigate-pulse]
name = "Frigate fusion pulse drive"
kind = "fusion-pulse"
thrust_mn = { value = 119, est = true }
exhaust_kms = 8950
pulse_rate_hz = 140
hull_heat_fraction = 0.00001
notes = "Thrust from PHALAENA's estimate: 19,340 t × 6.16 m/s²."

[drive.cutter-pulse]
name = "Cutter fusion pulse drive"
kind = "fusion-pulse"
thrust_mn = { value = 83, approx = true }
exhaust_kms = 8950
pulse_rate_hz = 140
hull_heat_fraction = 0.00001
notes = "Thrust from BACILLUS: ~16,000 t × ~5.2 m/s²."
