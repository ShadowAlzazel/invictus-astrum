# Source: RATE AND ROLE §5, §6.1, §8.10; THE OLD FOREST §4. Figures est. where the note gives none.
[class]
id = "dryad"
name = "Dryad"
lineage = "old-forest"
rate = "frigate"
terms = ["heavy frigate; Constitution", "the backbone frigate's ancestor"]
old_rating = "the 38"
summary = "The experimental heavy frigate who broke the 1 kA barrier and became the backbone of Garden frigate doctrine: the Old Forest's Constitution."
symbol = "DRY"
places = ["police frigate", "internal picket", "MINERVA pipeline, middle step"]

[hull]
length_m = 200
mass_t = 14000

[drive]
module = "of-frigate"
hull_mass = "dry"
dv_kms = 4000
sized_g = 0.55

[aim]                        # TEMPORARY: not yet stated; a little behind the PHALAENA's
rated_urad = { value = 6.0, est = true }
demasted_urad = { value = 16, est = true }

[layout]                     # stations along the hull, metres from the bow; est.
truss_m = 35
citadel_m = [35, 185]

[[battery]]
id = "spinal"
label = "Spinal battery"
stack = "dryad"
count = 2
firing = "together"
focus = true
fire = "56 MJ a stack, 112 MJ both: 14 thin channels, the first."

[[battery]]
id = "main"
label = "Main battery"
mounts = [
  { turret = "bina-ii-31-of", side = "dorsal", at_m = 90 },
  { turret = "bina-ii-31-of", side = "dorsal", at_m = 120 },
  { turret = "bina-ii-31-of", side = "ventral", at_m = 90 },
  { turret = "bina-ii-31-of", side = "ventral", at_m = 120 },
]
arrangement = "Four BINA on the older II/31: 8 guns."

[endurance]
quiet_mw = { value = 25, est = true, note = "TEMPORARY: not yet stated; about a PHALAENA's" }   # whether she has wings is open: she never runs cold

[history]
built_as = "experimental heavy frigate"
serves_as = "police frigate, internal picket, and the middle step of the MINERVA pipeline"
notable = ["Broke the 1 kA barrier", "A ship above her rate whose success changed what the rate meant"]

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 5000, est = true, note = "TEMPORARY: the frigate rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]
count = 2
fluence = { damaged = 1.2, destroyed = 25.0, est = true }
hits = { value = 2, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 3600, est = true }
