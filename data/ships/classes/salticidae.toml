# Source: SHIPS OF THE CLASSIS §5; RATE AND ROLE §8.4.
[class]
id = "salticidae"
name = "SALTICIDAE VIGIL"
lineage = "garden"
genus = { word = "SALTICIDAE", meaning = "jumping spiders" }
epithet = { word = "VIGIL", meaning = "watchman: Rome's night watch" }
builder = "ARCVS"
rate = "frigate"
terms = ["fifth rate; repeating frigate", "airborne early warning"]
summary = "The eyes and voice of the fleet. She sees, relays, assays and controls the picture as Overlord or Overwatch. Not a frontline ship."
symbol = "VIG"
in_classis = { range = [5, 6] }
successor_of = "holzweiber"

[hull]
body = "eight wings, fixed, in an X from both ends: the radiators"
length_m = { value = 150, approx = true }
mass_t = { value = 22000, approx = true }       # dry: her tanks empty
acceleration_ms2 = { value = 5.4, est = true, note = "tanks empty; about 3.7 full" }
protection_kgm2 = { citadel = 133, bumper = 12 }    # two-thirds of a frigate's (PHALAENA: 200, 18)
complement = { value = 150, approx = true, note = "a frigate has about 180" }

# Her drive: the frigate drive, 119 MN, with the fleet's 4,000 km/s budget: about 0.37 g with her
# tanks full, 0.55 g with them empty.
[drive]
module = "frigate"
hull_mass = "dry"
dv_kms = 4000

[[battery]]
id = "domes"
label = "Domes"
dome = "xix-b"
count = 4

[[battery]]
id = "strips"
label = "Strips"
strip = "light"
pairs = 6
notes = "Dazzles 124 apertures at once; takes a mast by light in ~0.2 s at 1,000 km."

[[battery]]
id = "missiles"
label = "Missiles"
cell = "missile"
count = 84

[[battery]]
id = "telescopes"
label = "Telescopes"
sensor = "ir-telescope"
count = 2
facing = ["port", "starboard"]        # one per cone: forward, aft, port, starboard, dorsal, ventral, or [forward, port, up]

[[point_defence]]
bearing = "above or below"
at_km = 1000
kills_per_s = { value = 0.96, approx = true }

[[point_defence]]
bearing = "median"
at_km = 1000
kills_per_s = { value = 0.30, approx = true }

[[point_defence]]
at_km = 300
kills_per_s = { value = 11, approx = true }

[[sensor]]
what = "A missile plume"
reach = "~4 AU, in one second"

[[sensor]]
what = "A cold hull, by telescope"
reach = "~1 AU"

[[sensor]]
what = "A cold hull, by active scan"
reach = "~4,400 km, every 10 s"

[[sensor]]
what = "A cold rod"
reach = "tens to hundreds of thousands of km when cued, est."

[[sensor]]
what = "Emitters"
reach = "located to a few km at 10,000 km, by her masts"

[endurance]
thermal_store_tj = 2.8
quiet_mw = { value = 20, est = true, note = "TEMPORARY: not yet stated; a BACILLUS's 19 MW, scaled up a little" }   # fixed wings: she never runs cold
notes = "She watches and relays indefinitely; all optics working, about 58 hours."

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 5000, est = true, note = "TEMPORARY: the frigate rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]     # liquid lithium in fractal copper fins: large, and hard to put out
count = 2
fluence = { damaged = 1.2, disabled = 25.0, destroyed = 82.7, est = true }
hits = { value = 8, est = true }
damaged = "degraded"
degraded_share = { value = 0.75, est = true }
repairable = ["damaged", "disabled"]
repair_s = { value = 1800, est = true }
