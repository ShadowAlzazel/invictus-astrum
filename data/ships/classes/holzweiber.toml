# Source: RATE AND ROLE §6.1, §7, §8.9; THE OLD FOREST §3. Figures est. where the note gives none.
[class]
id = "holzweiber"
name = "Holzweiber"
lineage = "old-forest"
rate = "line"
terms = ["third rate; the 74", "the emitter"]
old_rating = "the third-rate cruiser of its time"
summary = "The 74 of the Old Forest, the backbone of its line. Refitted as the emitter: the ship that ranges so the line can stay cold."
symbol = "HLZ"

[hull]
length_m = 300
mass_t = 36000

[drive]
module = "of-cruiser"        # 201 MN, typed on the drive
hull_mass = "dry"
dv_kms = 4000

[aim]                        # TEMPORARY: not yet stated
rated_urad = { value = 7.5, est = true }
demasted_urad = { value = 20, est = true }

[layout]                     # stations along the hull, metres from the bow; est.
truss_m = 75
citadel_m = [75, 225]

[[battery]]
id = "spinal"
label = "Spinal battery"
stack = "holzweiber"
count = 2
firing = "alternate"
focus = true
fire = "230 MJ a stack, 461 MJ both: nearly three PHALAENA stacks' energy in one."

[[battery]]
id = "main"
label = "Main battery"
mounts = [
  { turret = "bina-ii-44", side = "dorsal", at_m = 120 },
  { turret = "bina-ii-44", side = "dorsal", at_m = 150 },
  { turret = "bina-ii-44", side = "ventral", at_m = 120 },
  { turret = "bina-ii-44", side = "ventral", at_m = 150 },
]
arrangement = "Four twins, dorsal and ventral, superfiring: 8 guns, PILVM, 2.0 GJ. One nature since her refit."

[[battery]]
id = "optical"
label = "Long strips"
strip = "long"
pairs = 1
facing = ["port", "starboard"]
notes = "Port and starboard, facing out across her beams."

[[battery]]
id = "blisters"
label = "Sensor blisters"
dome = "xix-a-of"
count = 2
facing = ["dorsal", "ventral"]
notes = "Fitted in place of her two 1.7 kg turrets."

[endurance]
quiet_mw = { value = 60, est = true, note = "TEMPORARY: not yet stated" }   # she never runs cold

[history]
built_as = "line ship: the backbone of the Old Forest line"
serves_as = "emitter"
refit = "a razee in reverse: two 1.7 kg turrets given up for active sensor blisters"
notable = ["Her long strips became the Garden's wing-edge strips",
           "Her vocation passed to the SALTICIDAE VIGIL, her successor in everything but name"]

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 15000, est = true, note = "TEMPORARY: the line rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]
count = 2
fluence = { damaged = 1.2, destroyed = 25.0, est = true }
hits = { value = 2, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 3600, est = true }
