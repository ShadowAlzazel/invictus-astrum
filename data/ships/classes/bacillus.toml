# Source: SHIPS OF THE CLASSIS §8; RATE AND ROLE §8.5, §10.
[class]
id = "bacillus"
name = "BACILLUS LICTRIX"
lineage = "garden"
genus = { word = "BACILLUS", meaning = "little rod" }
epithet = { word = "LICTRIX", meaning = "female lictor" }
builder = "ARCVS"
places = ["in a Classis (AVC)", "the Astrum Guard (AAG)"]
rate = "unrated"
terms = ["revenue cutter", "coast guard cutter"]
summary = "Police vessel and auxiliary escort. She guards headquarters and transports against what is not a warship, and answers civil craft with force she can scale."
symbol = "CUT"
in_classis = { range = [8, 12] }

[hull]
body = "four wings, stacked in pairs; they do not fold"
length_m = { value = 150, approx = true }
mass_t = { value = 16000, approx = true }
acceleration_ms2 = { value = 5.2, approx = true }

[drive]
module = "cutter"
hull_mass = "wet"
dv_kms = 4000

[[battery]]
id = "main"
label = "Main battery"
mounts = [{ turret = "bina-i-15" }, { turret = "bina-i-15" }, { turret = "bina-i-15" },
          { turret = "bina-i-15" }, { turret = "bina-i-15" }, { turret = "bina-i-15" }]
arrangement = "12 guns on two-thirds of the horizon; 8 forward; 4 aft"
magazine = { standard = 26000 }
reach_km = { "against warships, up to" = 70, "civil craft at 1 m/s²" = 77, "civil craft at 0.1 m/s²" = 245, "civil craft at 0.01 m/s²" = 775 }
notes = "Holes every hull in service; punctures, does not destroy. About 3 hours of full fire."

[[battery]]
id = "optical"
label = "LIGHT strips"
strip = "light"
pairs = 2
notes = "Ranges to ~2,500 km."

[[battery]]
id = "missiles"
label = "Missiles"
cell = "missile"
count = "—"

[[point_defence]]
at_km = 100
kills_per_s = { value = 6.4, approx = true }

[endurance]
thermal_store_tj = 2.4
quiet_mw = 19                # her quiet load, shed by her fixed wings: she never runs cold
notes = "Runs indefinitely on her fixed wings; guns at full cycle, about 37 hours."

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 2000, est = true, note = "TEMPORARY: the unrated rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]     # liquid lithium in fractal copper fins: large, and hard to put out
count = 2
fluence = { damaged = 1.2, disabled = 25.0, destroyed = 82.7, est = true }
hits = { value = 8, est = true }
damaged = "degraded"
degraded_share = { value = 0.75, est = true }
repairable = ["damaged", "disabled"]
repair_s = { value = 1800, est = true }
