# Source: SHIPS OF THE CLASSIS §8; RATE AND ROLE §8.5, §10.
[class]
id = "bacillus"
name = "BACILLUS LICTRIX"
lineage = "garden"
genus = { word = "BACILLUS", meaning = "little rod" }
epithet = { word = "LICTRIX", meaning = "female lictor" }
builder = "ARCVS"
places = ["in a Classis (AVC)", "the Astrum Guard (AAG)"]
rate = "unrated"
terms = ["revenue cutter", "coast guard cutter"]
summary = "Police vessel and auxiliary escort. She guards headquarters and transports against what is not a warship, and answers civil craft with force she can scale."
symbol = "CUT"
in_classis = { range = [8, 12] }

[hull]
body = "four wings, stacked in pairs; they do not fold"
length_m = { value = 150, approx = true }
mass_t = { value = 16000, approx = true }
acceleration_ms2 = { value = 5.2, approx = true }

[drive]
module = "cutter"
hull_mass = "wet"
dv_kms = 4000

[[battery]]
id = "main"
label = "Main battery"
mounts = [{ turret = "bina-i-15" }, { turret = "bina-i-15" }, { turret = "bina-i-15" },
          { turret = "bina-i-15" }, { turret = "bina-i-15" }, { turret = "bina-i-15" }]
arrangement = "12 guns on two-thirds of the horizon; 8 forward; 4 aft"
magazine = { standard = 26000 }
reach_km = { "against warships, up to" = 70, "civil craft at 1 m/s²" = 77, "civil craft at 0.1 m/s²" = 245, "civil craft at 0.01 m/s²" = 775 }
notes = "Holes every hull in service; punctures, does not destroy. About 3 hours of full fire."

[[battery]]
id = "optical"
label = "LIGHT strips"
strip = "light"
pairs = 2
notes = "Ranges to ~2,500 km."

[[battery]]
id = "missiles"
label = "Missiles"
cell = "missile"
count = "—"

[[point_defence]]
at_km = 100
kills_per_s = { value = 6.4, approx = true }

[endurance]
thermal_store_tj = 2.4
quiet_mw = 19                # her quiet load, shed by her fixed wings: she never runs cold
notes = "Runs indefinitely on her fixed wings; guns at full cycle, about 37 hours."
