# Source: SHIPS OF THE CLASSIS §6; RATE AND ROLE §8.6.
[class]
id = "coccinella"
name = "COCCINELLA MOLLITRIX"
lineage = "garden"
genus = { word = "COCCINELLA", meaning = "ladybird" }
epithet = { word = "MOLLITRIX", meaning = "she who softens (sense not yet set)" }
rate = "auxiliary"
terms = ["storeship", "fleet tender"]
summary = "The most common tender. She takes the line's heat so the line can stay dark, and carries its stores."
symbol = "TND"
in_classis = { range = [12, 16] }

[hull]
length_m = 210
width_m = { closed = 180, expanded = 350 }
# With her tanks full: her hull and her own propellant alone (light), with the formation's stores,
# ammunition and propellant aboard (loaded), and overfilled with 20,000 t more fuel (carried as
# stores for now: the simulation burns only her own propellant).
mass_t = { light = 34700, loaded = 50000, overfilled = 70000 }
acceleration_ms2 = { value = 3.43, approx = true, note = "about 0.35 g, light" }

# Her drive: the frigate drive, 119 MN. Her own propellant is set so she makes about 0.35 g at her
# most, light: 119 MN / 0.35 g = 34,700 t, less a hull of about 20,000 t. Loaded she makes about
# 0.24 g; overfilled, about 0.17 g.
[drive]
module = "frigate"
hull_mass = "wet"
propellant_t = { value = 14700, est = true }

[[battery]]
id = "optical"
label = "Point defence"
panel = "i"
count = 20

[[point_defence]]
at_km = 100
kills_per_s = { value = 8, approx = true }

[endurance]
quiet_mw = { value = 560, approx = true, note = "her dimmest: covers closed, grade I" }   # she never runs cold

[tending]
radiating_gw = { "fully expanded" = 23, "covers open" = 5.8, closed = 3.4 }
cold_carried_tj = { value = 76, est = true, note = "up to, in her loaded mass" }
work = "latches on top; swaps coolant and ELYTRA panels; replaces whiskers"

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 3000, est = true, note = "TEMPORARY: the auxiliary rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]
count = 2
fluence = { damaged = 1.2, destroyed = 25.0, est = true }
hits = { value = 2, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 3600, est = true }
