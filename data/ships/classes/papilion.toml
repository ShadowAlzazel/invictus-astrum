# Source: SHIPS OF THE CLASSIS §2; RATE AND ROLE §8.1; DE COLLINEATIONE §4.1.
[class]
id = "papilion"
name = "PAPILION VENATRIX"
lineage = "garden"
genus = { word = "PAPILION", meaning = "Butterfly" }
epithet = { word = "VENATRIX", meaning = "Huntress" }
builder = "ARCVS"
rate = "line"
terms = ["Ship of the Line", "Battlecruiser"]
summary = "The heavy of ARCVS. She kills hulls, and works behind the frigate screen."
symbol = "PAP"
in_classis = { range = [58, 72], note = "midpoint ~65" }

[hull]
body = "two wings per side"
length_m = 390
wingspan_m = { spread = 140, folded = 62 }
mass_t = { light = 62340, full = 70340 }
acceleration_ms2 = { full = 4.41, light = 4.98 }   # 0.45 g full (SHIPS OF THE CLASSIS: 5.40 and 6.09, at 0.55 g)
material = "MAJOR-6 woven silk"
protection_kgm2 = { citadel = 547, joints = 688, bumper = 18 }
complement = { value = 500, approx = true, note = "line rate: a line crew and a splice party" }

[drive]
module = "line"
hull_mass = "wet"          # the canon's masses are with tanks full: 4.41 m/s² at 70,340 t is the full-load figure
dv_kms = 4000              # the bench's budget; the propellant follows from the mark and the mix
sized_g = 0.45             # her most, full speed: 0.45 g fully loaded (the bench rates an engine at 0.40 g's 20.5 MN)

[aim]
rated_urad = 6.5
demasted_urad = 18
tiers = { green = [7.5, 8.0], rated = 6.5, experienced = 6.0, veteran = { value = 5.75, est = true }, exceptional = 5.5 }   # experienced: the canon's veteran; veteran est., halfway to exceptional

[layout]                     # stations along the hull, metres from the bow; mount stations est.
truss_m = 100
citadel_m = [100, 300]
wing_at_m = 130

[[battery]]
id = "spinal"
label = "Spinal battery"
stack = "line"
count = 2
firing = "alternate"
focus = true                # the ship's main weapon: the battery her tactics are built around
fire = "One stack, then the other; both at once is a surge, not a standard."

[[battery]]
id = "main"
label = "Main battery"
mounts = [
  { turret = "qvadra-ii-44", side = "dorsal", at_m = 150 },
  { turret = "qvadra-ii-44", side = "dorsal", at_m = 178 },
  { turret = "bina-ii-44", side = "dorsal", at_m = 204 },
  { turret = "qvadra-ii-44", side = "ventral", at_m = 160 },
  { turret = "bina-ii-44", side = "ventral", at_m = 188 },
]
arrangement = "Three dorsal mounts (4-4-2) and two ventral (4-2), each group superfiring; the barbettes drop down the alley between the stacks."
magazine = { standard = 3200, barrage = 28200 }
reach_km = { "kills an evading titanium hull" = 87, "kills an evading woven hull" = 66, "kills a blinded or fixed target" = 2500 }

[[battery]]
id = "optical"
label = "Optical battery"
strip = "capital"
pairs = 1
arrangement = "SPECVLVM ALARVM: the forewing leading edges, six panels a side."

[[point_defence]]
bearing = "forward"
at_km = 1000
kills_per_s = { value = 12, approx = true }

[[point_defence]]
bearing = "forward"
at_km = 300
kills_per_s = { value = 140, approx = true }

[endurance]
thermal_store_tj = 10.8
mane_gw = 1.0             # what the manes reject while she burns (the bench)
cold_h = { "wings folded" = 36, "optics firing" = 28.4 }
notes = "Wings spread, the clock does not run."

[combat]
annihilation_floor_km = { value = 2400, est = true, note = "against her equals" }

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 15000, est = true, note = "TEMPORARY: the line rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]     # liquid lithium in fractal copper fins: large, and hard to put out
count = 2
fluence = { damaged = 1.2, disabled = 25.0, destroyed = 82.7, est = true }
hits = { value = 8, est = true }
damaged = "degraded"
degraded_share = { value = 0.75, est = true }
repairable = ["damaged", "disabled"]
repair_s = { value = 1800, est = true }
