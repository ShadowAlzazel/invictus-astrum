# Source: SHIPS OF THE CLASSIS §4; RATE AND ROLE §8.3; DE COLLINEATIONE §4.3.
[class]
id = "aeshna"
name = "AESHNA ARQUITRIX"
lineage = "garden"
genus = { word = "AESHNA", meaning = "Hawker Dragonfly" }
epithet = { word = "ARQUITRIX", meaning = "Archeress" }
builder = "ARCVS"
rate = "line"
terms = ["Second Rate", "Air-Defence Cruiser"]
summary = "The Point-Defence cruiser. She stands over what cannot dodge, and is the fleet's answer to missile saturation."
symbol = "AES"
in_classis = { range = [10, 15], note = "midpoint ~12.5" }

[hull]
body = "Four wings in an X"
length_m = 350
wingspan_m = { spread = 180 }
mass_t = { value = 55000, est = true }
acceleration_ms2 = { value = 4.73, est = true, note = "tanks full: 260 MN on 55,000 t" }
material = "MAJOR-6 woven silk"
protection_kgm2 = { citadel = 446, joints = 592, bumper = 18 }
complement = { value = 450, approx = true }

[drive]
module = "escort"           # 260 MN: less thrust than a PAPILION, a deeper tank
hull_mass = "wet"          # her mass is with tanks full
dv_kms = 5000              # a quarter over the fleet's 4,000 km/s budget

[aim]
rated_urad = 6.0
demasted_urad = { value = 18, est = true }
tiers = { green = [7.0, 7.5], rated = 6.0, experienced = 5.5, veteran = { value = 5.0, est = true } }   # experienced: the canon's veteran; veteran est., a step on (no exceptional given)

[[battery]]
id = "domes"
label = "Domes"
dome = "xxxvii"
count = 5
sides = { ventral = 3, dorsal = 2 }
focus = true                # the ship's main weapon: the battery her tactics are built around
notes = "Every bearing is seen by at least two domes."

[[battery]]
id = "strips"
label = "Strips"
strip = "picket"
pairs = 2
notes = "Dazzles every open sensor in a formation."

[[battery]]
id = "spinal"
label = "Spinal battery"
stack = "picket"
count = 6
firing = "together"
fire = "six patterns every 10 s"

[[battery]]
id = "missiles"
label = "Missiles"
cell = "missile"
count = 90

[[point_defence]]
bearing = "nadir, three domes"
at_km = 1000
kills_per_s = { value = 52, approx = true }

[[point_defence]]
bearing = "nadir, three domes"
at_km = 300
kills_per_s = { value = 570, approx = true }

[[point_defence]]
bearing = "zenith, two domes"
at_km = 1000
kills_per_s = { value = 34, approx = true }

[[point_defence]]
bearing = "zenith, two domes"
at_km = 300
kills_per_s = { value = 380, approx = true }

[[point_defence]]
bearing = "median over the sphere"
at_km = 1000
kills_per_s = { value = 7.8, approx = true }

[[point_defence]]
bearing = "median over the sphere"
at_km = 300
kills_per_s = { value = 86, approx = true }

[[point_defence]]
bearing = "weakest: astern, just above the hull plane"
at_km = 1000
kills_per_s = { value = 0.85, approx = true }

[[point_defence]]
bearing = "weakest: astern, just above the hull plane"
at_km = 300
kills_per_s = { value = 9.4, approx = true }

[endurance]
thermal_store_tj = 45.4
working_days = { "full working ceiling" = 6, "cold, wings folded" = 8 }

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 15000, est = true, note = "TEMPORARY: the line rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]     # liquid lithium in fractal copper fins: large, and hard to put out
count = 2
fluence = { damaged = 1.2, disabled = 25.0, destroyed = 82.7, est = true }
hits = { value = 8, est = true }
damaged = "degraded"
degraded_share = { value = 0.75, est = true }
repairable = ["damaged", "disabled"]
repair_s = { value = 1800, est = true }
