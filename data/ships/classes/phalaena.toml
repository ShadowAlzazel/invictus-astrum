# Source: SHIPS OF THE CLASSIS §3; RATE AND ROLE §8.2; DE COLLINEATIONE §4.2.
[class]
id = "phalaena"
name = "PHALAENA SPECULATRIX"
lineage = "garden"
symbol = "PHA"
rate = "frigate"
builder = "ARCVS"

# flavour
genus = { word = "PHALAENA", meaning = "Moth" }
epithet = { word = "SPECULATRIX", meaning = "Scout, Watcher" }
summary = "The workhorse of the navy. She opens the action by taking eyes, and decides it against titanium."

# designations
in_classis = { range = [102, 144], note = "midpoint ~123" }
places = ["line", "picket", "light escort", "police", "detached"]
terms = ["Heavy Frigate", "Multi-Role Destroyer"]

[hull]
body = "One wing per side"
length_m = 240
wingspan_m = { spread = 80, folded = 38 }
mass_t = { value = 19340, est = true }
acceleration_ms2 = { value = 6.16, est = true }
material = "MAJOR-6 woven silk"
protection_kgm2 = { citadel = 200, bumper = 18 }
complement = { value = 180, note = "reduced; damage-control weaving, no splice party" }

[drive]
module = "frigate"
hull_mass = "wet"
dv_kms = 4000

[aim]
rated_urad = 5.5
demasted_urad = 15
tiers = { green = [6.5, 7.0], rated = 5.5, experienced = 5.0, veteran = { value = 4.5, est = true }, exceptional = 4.0 }   # experienced: the canon's veteran; veteran est., halfway to exceptional

[layout]                     # stations along the hull, metres from the bow; mount stations est.
truss_m = 70
citadel_m = [70, 220]
wing_at_m = 95

[[battery]]
id = "spinal"
label = "Spinal battery"
stack = "picket"
count = 4
firing = "together"
fire = "Four patterns, four targets, up to 24 spots a salvo."

[[battery]]
id = "main"
label = "Main battery"
mounts = [
  { turret = "bina-ii-31", side = "dorsal", at_m = 120 },
  { turret = "bina-ii-31", side = "dorsal", at_m = 150 },
  { turret = "bina-ii-31", side = "ventral", at_m = 120 },
  { turret = "bina-ii-31", side = "ventral", at_m = 150 },
]
arrangement = "Four BINA: two dorsal, two ventral; dorsal and ventral doubles wound opposite hands."
magazine = { standard = 35000 }
reach_km = { "dodgeable outside" = 47 }

[[battery]]
id = "optical"
label = "PICKET strip pair"
strip = "picket"
pairs = 1
notes = "Dazzles without breaking cold; ranges to 0.15 m inside 5,000 km."

[[point_defence]]
at_km = 300
kills_per_s = { value = 8.7, approx = true }

[[point_defence]]
at_km = 1000
kills_per_s = { value = 0.8, approx = true }

[endurance]
thermal_store_tj = 5.0
cold_h = { "wings folded" = 48, "strip working" = 40.2 }
notes = "Wings spread, the clock does not run."

# ---- damage: what a hit does to her (data for the simulation to come; the simulation still reads
# data/ships/rules.toml [damage]). est. throughout, TEMPORARY until the owner's; docs/COMBAT.md.
#   hp_mj       her hull points: hull-opening energy she takes before she is destroyed
#   spread      where her own hits land among a target's systems (rules.toml [damage.spread]; a ship may name another)
#   [damage.share]  her silhouette: of the channels on her hull, and on her citadel, the share each kind takes
#   [damage.systems.KIND]  weapon (each battery), sensor (each mast), drive, radiator:
#       count         how many (weapons and sensors: her batteries and masts)
#       fluence       MJ/m² one channel takes one to each state
#       hits          channels at that fluence before it goes (1: one shot, one kill)
#       damaged       what damaged means: "out", or "degraded" (working at degraded_share)
#       repairable    the states her damage control brings back, and repair_s how long (a rated crew; rules [crew] repair_k)
[damage]
hp_mj = { value = 5000, est = true, note = "TEMPORARY: the frigate rate's" }
spread = "regular"

[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15, est = true }
citadel = { weapon = 0.2, drive = 0.2, est = true }

[damage.systems.weapon]
fluence = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
hits = { value = 1, est = true }
damaged = "out"
repairable = ["damaged"]
repair_s = { value = 1800, est = true }

[damage.systems.sensor]
fluence = { damaged = 0.075, destroyed = 2.91 }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 900, est = true }

[damage.systems.drive]
fluence = { damaged = 25.0, disabled = 82.7, destroyed = 165.4, est = true }
hits = { value = 1, est = true }
damaged = "degraded"
degraded_share = { value = 0.5, est = true }
repairable = ["damaged"]
repair_s = { value = 7200, est = true }

[damage.systems.radiator]     # liquid lithium in fractal copper fins: large, and hard to put out
count = 2
fluence = { damaged = 1.2, disabled = 25.0, destroyed = 82.7, est = true }
hits = { value = 8, est = true }
damaged = "degraded"
degraded_share = { value = 0.75, est = true }
repairable = ["damaged", "disabled"]
repair_s = { value = 1800, est = true }
