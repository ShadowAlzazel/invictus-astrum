# Assemblies: what TELVM builds from the parts. A class fits these; it never restates them.
#
#   [turret.*]  guns on one ring: driver, guns, ring, furniture
#   [stack.*]   channels sharing a cryostat, RF, trim supply and reference; and the reaches it is rated to
#   [strip.*]   optical panels on one edge; fitted in pairs
#   [dome.*]    optical facets on one faceted cap
#
# Rated reaches are TELVM §3.7 at the standard conditions: 5 nT transverse, stack rating 0.3 µrad.
# They come from TORMENTA's propagation model and are data here, not derived.

