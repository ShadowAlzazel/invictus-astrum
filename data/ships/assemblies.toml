# ---- domes -------------------------------------------------------------------------------------------
# full_phase_aperture_m: the filled aperture when every facet on the live face phases on one point,
# on the dome's own axis. A dome may state its rated missile kills where the model does not reach.
[dome.xix]
name = "DOME XIX"
sensor = "dome-optic"
panel = "c"
facets = 19
base_ring_m = 13
full_phase_aperture_m = 10.0
dazzle_km = 40000

[dome.xix-b]
name = "DOME XIX-B, the watch dome"
