# ---- strips ------------------------------------------------------------------------------------------
# Panels in a strip combine incoherently: each panel is its own aperture and its own track. A strip
# or a dome is also a sensor (sensor: which, parts.toml): one cone for each.
[strip.light]
sensor = "strip-optic"
name = "LIGHT strip"
panel = "i"
panels = 4
edge_m = 12
dazzle_km = 40000

[strip.picket]
sensor = "strip-optic"
name = "PICKET strip"
panel = "ii"
panels = 6
edge_m = 32
dazzle_km = 40000

[strip.capital]
