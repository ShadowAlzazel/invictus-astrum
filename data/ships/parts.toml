# Parts: what TORMENTA catalogues. Each part states what it is; what it does in an assembly is
# worked out from these (astrum/armoury.py) and never typed in twice.
#
#   [driver.*]   helical guns: the barrel, its velocity and cycle, its mass
#   [round.*]    the natures a driver fires: mass, package (round and armature), shape
#   [channel.*]  UREB channels by type and mark: current, linear mass, aperture, trim fittings
#   [panel.*]    optical panels: aperture and emitters; output, heat and mass follow
#   [cell.*]     missile cells and tubes, rated by count only
#   [sensor.*]   fitted sensors
#   [constants]  what every part shares
#
# Figures take the registry's forms: 5.0, { value = 13, est = true }, or "—" when not yet stated.

[constants]
gun_efficiency = 0.60          # muzzle energy of the package ÷ draw
gun_heat_share = 0.38          # of the draw, into the hull
beam_efficiency = 0.60         # beam energy ÷ draw; the rest is heat
pulse_us = 0.8                 # UREB pulse width
emitter_kw = 12                # one emitter per 0.61 m² of aperture
wall_plug = 0.45               # optical output ÷ electrical draw
panel_t_per_m2 = 0.357         # panel mass per m² of aperture
wavelength_um = 1.03
missile_kill_mjm2 = 30         # missile tankage, 3 mm: the working kill fluence
gamma_per_gev = 1957           # electron γ per GeV

