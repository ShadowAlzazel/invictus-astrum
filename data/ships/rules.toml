# Rules every ship class is read against: the vocabulary of RATE AND ROLE and the aim model of
# DE COLLINEATIONE. Classes name these by id; the server refuses a class that names one not here.

# ---- rate: who commands her, and how many hands --------------------------------------------------
[rate.line]
label = "Line rate"
half_beam_m = 45                     # TELVM §1.1: sets the hull's capacitance, so the charge a salvo leaves
citadel_length_m = 200               # TELVM §1.3.4: the line-rate citadel, 200 × 90 m (a class's layout may say)
commanded_by = "a Commander"
hands = "about five hundred, in ten serving cohorts and an eleventh at depot"
covers = "ships of the line, battlecruisers and cruisers"

[rate.frigate]
label = "Frigate"
half_beam_m = 25                     # picket rate
citadel_length_m = 150               # TELVM §1.3.4: the picket-rate citadel, 150 × 50 m
commanded_by = "a Captain"
hands = "fewer"
covers = "the frigates; the most independent posting below flag rank"

[rate.auxiliary]
label = "Auxiliary"
covers = "the fleet's harbour, carried with it"

[rate.unrated]
label = "Not rated"
covers = "cutters and other hulls below the frigate, as sloops and cutters were not rated in sail"

# ---- lineage: the two plans ------------------------------------------------------------------------
[lineage.garden]
label = "The Garden"
names = "binomial: a genus for the body, an epithet for the vocation"
order = "carried by the epithet"
design = "one line ship, one frigate, specialists for everything else"

[lineage.old-forest]
label = "The Old Forest"
names = "proper names: spirits of the forest"
order = "carried by rating"
design = "generalists in graded sizes"

# ---- crew: experience moves aim, never the beam ------------------------------------------------------
[crew.green]
label = "Green"
who = "a MINERVA and crew with no engagement behind them"

[crew.rated]
label = "Rated"
who = "after one engagement"

[crew.veteran]
label = "Veteran"
who = "after several"

[crew.exceptional]
label = "Exceptional"
who = "the best MINERVA and crews"

# ---- the wall: where the miss equals the target ------------------------------------------------------
# R = size / θ: the range at which the beam's miss θ equals a line-rate citadel, or a silhouette.
[wall.citadel]
label = "Citadel wall"
size_m = 64.3

[wall.silhouette]
label = "Silhouette wall"
size_m = 96.4

# ---- beam effects ------------------------------------------------------------------------------------
# A class gives each effect's beam reach (how far one stack carries it, at the standard 5 nT field).
# Usable reach is the lesser of that and the effect's wall at the crew's aim. `wall` absent: the beam
# runs out long before the aim does. `beam_km` absent on a class: the beam carries it past every wall.
[effect.open-woven]
label = "Opens a woven hull"
order = 1

[effect.open-titanium]
label = "Opens a titanium hull"
order = 2

[effect.shatter-titanium]
label = "Shatters titanium plate"
order = 3

[effect.mast]
label = "Takes a mast"
wall = "silhouette"
order = 4

[effect.radiator]
label = "Ruins a radiator"
wall = "silhouette"
order = 5

[effect.mane]
label = "Ruins a mane"
wall = "silhouette"
order = 6

[effect.electronics]
label = "Ruins electronics, ~100 Gy"
wall = "citadel"
order = 7

[effect.crew]
label = "Incapacitates crew, ~50 Gy"
wall = "citadel"
order = 8

[effect.crew-kill]
label = "Kills crew, ~5 Gy"
wall = "citadel"
order = 9

[effect.dazzle]
label = "Dazzles an open sensor"
order = 10

# ---- drive: what every class's [drive] is read against ----------------------------------------------
# cruise_g is doctrine: the band a fleet holds whatever its load. A drive that cannot reach the floor
# when fully loaded is shown, with the thrust it would need. A class may give its own cruise_g.
[drive]
cruise_g = [0.4, 0.5]

# ---- signature: what makes a ship seen, as the simulation keeps it --------------------------------
# Each class gives its heat in [endurance] (thermal store, cold time, quiet load); these turn it, and
# her drive, into what she gives off. TEMPORARY values are marked: step 3 (detection) calibrates
# them against the sensors' stated reaches.
[signature]
# Her plume: the drive's jet power (thrust x exhaust velocity / 2), seen at an angle off her tail
# (0: from dead astern, looking up the plume; 180: from dead ahead, the hull in the way). Degrees,
# and the share of the jet power seen there, drawn straight between. TEMPORARY.
plume_aspect = [[0, 1.0], [45, 0.6], [90, 0.2], [135, 0.03], [180, 0.005]]
cold_share = 0.01    # wings folded, what she still sheds, as a share of her quiet load. TEMPORARY
recover = 4          # wings spread, her store empties this many times faster than it filled. TEMPORARY

# ---- detection: what a ship sees, and what her faction makes of it ---------------------------------
# Every ship carries the standard suite (a sphere of cones), and her strips, domes and sensor
# batteries besides (parts.toml [sensor.*]). A faction knows a ship once any of its own sees her:
# where she was when that light left her.
[detection]
standard = { sensor = "passive", cones = 6 }
active = { sensor = "ranging", cones = 1 }      # every ship's active scan: swept only while she pings (an order)
classify = 4         # her plume seen this many times over the faintest a sensor sees (her drive gives her away): her class is known, if it is in the side's journal
identify = 25        # her hull and rads (her plume aside) seen this many times over the faintest a sensor sees: who she is is known (within a fifth of its reach)
lost = 1.5           # a track not seen again within this many of its sensor's sweeps is called lost: shown where it was, uncertain
hold_s = 3600        # ... and after this long, dropped

# ---- relay: how what a ship sees reaches her fleet's flagship --------------------------------------
# Every formation has a leader (its flag, in the scenario; else the ship it is placed on, else its
# first ship), and the leader of a side's top formation is its fleet flagship: where its picture is.
# A ship's report goes up the leaders to the flagship: between leaders, and from a Vigil (one of
# these classes, straight to the flagship), at `fast` times c; from any other ship to her leader at
# `slow` times c; through the nearest Vigil instead if that comes in sooner.
[relay]
vigils = ["salticidae"]
fast = 1.0
slow = 0.3

# ---- a salvo: where a stack's channels land (astrum/salvo.py) --------------------------------------
# TORMENTA §4.7's spot: space charge from the muzzle (r'' = K/r, solved, from a quarter of the
# aperture) and the ambient field's streak; it gives §4.8's table. TELVM §1.3: the ship's aim θ moves
# the whole pattern together, each channel scatters about it by the stack rating. A salvo lands
# where it lands; a channel hits if it lands on the target's presented size (s = k·√(L·W),
# foreshortened by her aspect), and the per-salvo chance on a line citadel is §1.3.3's
# 1 - exp(-(s/θR)²): ~63% at the wall, ~22% at twice it.
[salvo]
field_nt = 5.0                       # TELVM §1.2: the standard transverse field
stack_rating_urad = 0.3              # TELVM §1.2: how closely a stack's channels land on one another
muzzle_share = 0.25                  # est., TORMENTA §4.7: the muzzle beam radius, of the aperture
size_k = { value = 0.479, est = true, note = "TELVM §1.3.4's sizes over √(L·W): 64.3, 41, 186 m for 200×90, 150×50, 500×300" }

# ---- light on a target: an optical battery's dwell (astrum/optics.py) ------------------------------
# TORMENTA §6: apertures combine incoherently, each its own spot d = 2.44 λR/D; on a hull the beam
# wanders over her aim error and spreads over max(d, θR) (§6.5); on hot structure or a sensor
# looking at her the loop closes and the spot is d. What a dwell reaches, by §6.7 and §8.
[optics]
wavelength_um = 1.03                 # TORMENTA §6.2
threshold = { mane_mjm2 = 0.8, radiator_mjm2 = 1.2, mast_mjm2 = 2.91, ir_window_wm2 = 1.0e4 }   # §8, §6.7 (est. there)

# ---- battle damage (astrum/damage.py) --------------------------------------------------------------
# One figure for now: the hull-opening energy a ship takes before she is destroyed. A hit takes off
# the energy it put on her, at the share of the opening fluence its own reaches.
[damage]
open_mjm2 = 82.7                     # TORMENTA §8: a woven hull opened
citadel_factor = { value = 2.0, est = true, note = "TEMPORARY: a channel on her citadel counts twice" }
hp_mj = { line = 15000, frigate = 5000, auxiliary = 3000, unrated = 2000, default = 5000, est = true, note = "TEMPORARY: hit points by rate, MJ of hull-opening energy, until survivability is the owner's (docs/COMBAT.md)" }

# Her systems (astrum/systems.py): the fluence (MJ/m²) a channel landing on one takes it to each state
# at. TORMENTA §8: electronics ruined ~0.075 (~100 Gy), titanium plate shattered ~25, a woven hull
# opened 82.7, a sensor mast 2.91, a radiator 1.2. Which state each reads off is est.
[damage.systems]
weapon = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
drive = { damaged = 0.075, disabled = 25.0, destroyed = 82.7 }
sensor = { damaged = 0.075, destroyed = 2.91 }
radiator = { destroyed = 1.2 }

# The share of the channels on her that land on each kind (the rest on her hull and crew alone):
# on her hull, and on her citadel (her stack and her drive's). TEMPORARY, until a class's silhouette
# says where each lies.
[damage.share]
hull = { sensor = 0.08, weapon = 0.06, radiator = 0.15 }
citadel = { weapon = 0.2, drive = 0.2 }

# Light held on her, closed loop (TORMENTA §6.5.1, §6.7): a sensor looking back, its mast ruined;
# a thermal-infrared window heated blind; else, her wings spread, a radiator ruined.
[damage.light]
mast_mjm2 = 2.91
ir_window_wm2 = 1.0e4
radiator_mjm2 = 1.2
