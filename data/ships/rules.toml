# Rules every ship class is read against: the vocabulary of RATE AND ROLE and the aim model of
# DE COLLINEATIONE. Classes name these by id; the server refuses a class that names one not here.

# ---- rate: who commands her, and how many hands --------------------------------------------------
[rate.line]
label = "Line rate"
half_beam_m = 45                     # TELVM §1.1: sets the hull's capacitance, so the charge a salvo leaves
commanded_by = "a Commander"
hands = "about five hundred, in ten serving cohorts and an eleventh at depot"
covers = "ships of the line, battlecruisers and cruisers"

[rate.frigate]
label = "Frigate"
half_beam_m = 25                     # picket rate
commanded_by = "a Captain"
hands = "fewer"
covers = "the frigates; the most independent posting below flag rank"

[rate.auxiliary]
label = "Auxiliary"
covers = "the fleet's harbour, carried with it"

[rate.unrated]
label = "Not rated"
covers = "cutters and other hulls below the frigate, as sloops and cutters were not rated in sail"

# ---- lineage: the two plans ------------------------------------------------------------------------
[lineage.garden]
label = "The Garden"
names = "binomial: a genus for the body, an epithet for the vocation"
order = "carried by the epithet"
design = "one line ship, one frigate, specialists for everything else"

[lineage.old-forest]
label = "The Old Forest"
names = "proper names: spirits of the forest"
order = "carried by rating"
design = "generalists in graded sizes"

# ---- crew: experience moves aim, never the beam ------------------------------------------------------
[crew.green]
label = "Green"
who = "a MINERVA and crew with no engagement behind them"

[crew.rated]
label = "Rated"
who = "after one engagement"

[crew.veteran]
label = "Veteran"
who = "after several"

[crew.exceptional]
label = "Exceptional"
who = "the best MINERVA and crews"

# ---- the wall: where the miss equals the target ------------------------------------------------------
# R = size / θ: the range at which the beam's miss θ equals a line-rate citadel, or a silhouette.
[wall.citadel]
label = "Citadel wall"
size_m = 64.3

[wall.silhouette]
label = "Silhouette wall"
size_m = 96.4

# ---- beam effects ------------------------------------------------------------------------------------
# A class gives each effect's beam reach (how far one stack carries it, at the standard 5 nT field).
# Usable reach is the lesser of that and the effect's wall at the crew's aim. `wall` absent: the beam
# runs out long before the aim does. `beam_km` absent on a class: the beam carries it past every wall.
[effect.open-woven]
label = "Opens a woven hull"
order = 1

[effect.open-titanium]
label = "Opens a titanium hull"
order = 2

[effect.shatter-titanium]
label = "Shatters titanium plate"
order = 3

[effect.mast]
label = "Takes a mast"
wall = "silhouette"
order = 4

[effect.radiator]
label = "Ruins a radiator"
wall = "silhouette"
order = 5

[effect.mane]
label = "Ruins a mane"
wall = "silhouette"
order = 6

[effect.electronics]
label = "Ruins electronics, ~100 Gy"
wall = "citadel"
order = 7

[effect.crew]
label = "Incapacitates crew, ~50 Gy"
wall = "citadel"
order = 8

[effect.crew-kill]
label = "Kills crew, ~5 Gy"
wall = "citadel"
order = 9

[effect.dazzle]
label = "Dazzles an open sensor"
order = 10

# ---- drive: what every class's [drive] is read against ----------------------------------------------
# cruise_g is doctrine: the band a fleet holds whatever its load. A drive that cannot reach the floor
# when fully loaded is shown, with the thrust it would need. A class may give its own cruise_g.
[drive]
cruise_g = [0.4, 0.5]

# ---- signature: what makes a ship seen, as the simulation keeps it --------------------------------
# Each class gives its heat in [endurance] (thermal store, cold time, quiet load); these turn it, and
# her drive, into what she gives off. TEMPORARY values are marked: step 3 (detection) calibrates
# them against the sensors' stated reaches.
[signature]
# Her plume: the drive's jet power (thrust x exhaust velocity / 2), seen at an angle off her tail
# (0: from dead astern, looking up the plume; 180: from dead ahead, the hull in the way). Degrees,
# and the share of the jet power seen there, drawn straight between. TEMPORARY.
plume_aspect = [[0, 1.0], [45, 0.6], [90, 0.2], [135, 0.03], [180, 0.005]]
cold_share = 0.01    # wings folded, what she still sheds, as a share of her quiet load. TEMPORARY
recover = 4          # wings spread, her store empties this many times faster than it filled. TEMPORARY

# ---- detection: what a ship sees, and what her faction makes of it ---------------------------------
# Every ship carries the standard suite (a sphere of cones), and her strips, domes and sensor
# batteries besides (parts.toml [sensor.*]). A faction knows a ship once any of its own sees her:
# where she was when that light left her.
[detection]
standard = { sensor = "passive", cones = 6 }
identify = 25        # seen this many times over the faintest a sensor sees: her class and name are known (within a fifth of its reach)
lost = 1.5           # a track not seen again within this many of its sensor's sweeps is called lost: shown where it was, uncertain
hold_s = 3600        # ... and after this long, dropped

