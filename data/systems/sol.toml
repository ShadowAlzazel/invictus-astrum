# Sol: the Sun, the eight planets, Pluto–Charon, and the major moons.
#
# Units as published: km, km³/s², AU, days, degrees. The builder converts to SI.
# Planets: JPL "Keplerian elements for approximate positions of the major planets" (Standish),
# table 1, valid 1800–2050, mean ecliptic and equinox of J2000; rates per Julian century.
# Physical data: IAU 2015 / JPL SSD planetary physical parameters; poles and rotation: IAU WGCCRE.
# Major-moon geometry (a, e, i, period) from JPL SSD mean elements, referred to the parent's
# equator. Their phases along the orbit are placeholders until fetched from JPL Horizons
# (tools/fetch_horizons.py); the map flags them.

[system]
id = "sol"
name = "Sol"
epoch = "2026-10-19T00:00:00Z"   # where the clock starts
sources = [
  "Standish, Keplerian Elements for Approximate Positions of the Major Planets (JPL SSD)",
  "Archinal et al. 2018, IAU WGCCRE Report 2015 (poles, rotation)",
  "JPL SSD planetary physical parameters and satellite mean elements",
  "Meeus, Astronomical Algorithms, 2nd ed., ch. 47 (lunar mean elements)",
]

[frame]
kind = "ecliptic-j2000"     # system plane = ecliptic; +x = vernal equinox; origin = the Sun

