# ---- numerical ephemeris -----------------------------------------------------------------------------
# JPL DE421 (1900–2050), shipped by the skyfield-data package. Where it covers a body and the
# date, positions come from it (kilometre-level); everywhere else the orbits above are used.
# Planet targets are system barycentres: each sits within a few hundred km of the planet's centre.
[ephemeris]
kind = "jpl-de"
file = "de421.bsp"
targets = { sun = "sun", mercury = "mercury", venus = "venus", "earth-moon" = "earth barycenter", earth = "earth", moon = "moon", mars = "mars barycenter", jupiter = "jupiter barycenter", saturn = "saturn barycenter", uranus = "uranus barycenter", neptune = "neptune barycenter", "pluto-charon" = "pluto barycenter" }
