# A fleet: formations and their ships, kept apart from any scenario (astrum/fleets.py). A scenario
# brings it in with  [[fleet]] id = "ghost"  and places it at its start. Units are written as a
# scenario writes them (see data/fleets/README.md); a unit with no formation above it takes the
# fleet's faction. Positions are in sol: its bodies, and the scenario player's bullseyes.

[fleet]
id = "ghost"
name = "Ghost flight"
faction = "ghost"
system = "sol"
notes = "The practice force: a PHALAENA flight beyond Mars."

# ---- GHOST: the practice force. A PHALAENA flight beyond Mars, at the edge of what Task Force 3 sees:
# the AESHNA's wide optics see a warm PHALAENA to about 29.4 million km; the flight stands at 97%,
# 100% and 103% of that, out from Mars on the line from the Sun. Placeholder callsigns.
[[contact]]
id = "ghost"
callsign = "Ghost flight"
affiliation = "unknown"
faction = "ghost"
echelon = "flight"
flag = "ghost-1"

[[contact]]
