# A fleet: formations and their ships, what each is, kept apart from any scenario (astrum/fleets.py).
# A scenario loads it with  [[fleet]] id = "luna-classis-1"  and places the units it has contacts for (where
# and how each starts); the rest are undeployed. Units: data/fleets/README.md. A unit with no
# formation above it takes the fleet's faction.

[fleet]
id = "luna-classis-1"
name = "Luna Classis I"
faction = "avc"
notes = "Task Forces 1 to 3, the Luna Strike Squadron, and the Classis's tenders and cutters."

# ---- friendly: one task force element, in flights, out of plane over Earth --------------------------

[[unit]]
id = "luna-classis-1"
callsign = "Luna Classis I"
affiliation = "friend"
faction = "avc"             # every formation and ship under her takes it, unless it names its own
echelon = "classis"
flag = "paris-2"            # her flagship, Gene Kranz: the fleet's picture is hers (astrum/relay.py)

[[unit]]
