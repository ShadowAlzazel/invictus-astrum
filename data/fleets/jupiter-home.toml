# A fleet: formations and their ships, what each is, kept apart from any scenario (astrum/fleets.py).
# A scenario loads it with  [[fleet]] id = "jupiter-home"  and places the units it has contacts for (where
# and how each starts); the rest are undeployed. Units: data/fleets/README.md. A unit with no
# formation above it takes the fleet's faction.

[fleet]
id = "jupiter-home"
name = "Jupiter Home Force"
faction = "jadf"
notes = "The JADF's: Io and Europa task groups, the Ganymede battle group, Callisto's early warning, a battle squadron."

# ---- the Jupiter Astrum Defence Force (JADF): the Jovian moons' own police, an ARCVS member world's ---
# Its hulls are under its Home Force, not a Classis: a task or battle group at each of Io, Europa and
# Ganymede, two early-warning flights at Callisto, and its battle squadron off Jupiter. Old Forest hulls
# bought as an allied navy buys them, and BACILLUS cutters. Placeholder ship callsigns.

[[unit]]
id = "jupiter-home"
callsign = "Jupiter Home Force"
affiliation = "friend"
faction = "jadf"
echelon = "task-force"
flag = "jove-1"

