# Combat profiles (astrum/profiles.py): what a ship does in combat, the engagement of her MINERVA
# (data/minerva.toml). The root is every ship's fallback; commanders copy a shared one on the map and
# change its targets and ranges (profiles.toml beside bullseyes.toml, not committed).
#
#   targets   whom she engages: "hostile" (identified as hostile), "unknown" (bogeys)
#   range     for a stance, how far out a target takes her into combat (as in minerva.toml); left
#             out, the stance's own
#   after     out of combat, this instead of her stance's (minerva.toml): "resume", "post", "hold",
#             "coast" (on as she goes, the drive cut)
#   start     the engagement's first node
#   node      the engagement's nodes. Entering one, she does what it says (do); from the next tick
#             on, the first of its ways out (on) whose condition holds takes her on ("exit": out of
#             combat, to her stance's after). A node may wait (wait_s) before any way out is taken.
#
#   do        "station" (on the target at the battery's envelope, keeping with her), "hold" (hold
#             station where she is on the target; with none, where she is), "face" (her hull on the
#             target), "fire" (the battery, a WeaponEngageOrder: the combat function, once it has
#             cycled; and every optical battery that reaches the target, held on it the tick), "pass" (a
#             burn through where the target will be), "correct" (a pass's course corrected); with
#             fire, "spine" (her spine as well, when her focus is not it) and "hold-heading" (her
#             heading is the admiral's: not turned for the shot, a stack fired only with her bow in trim)
#             and "turn-to-fire" (a stack off her bow while she burns: her drive cut for the shot, she
#             faces and fires; her node's station or hold burns her on the next tick)
#   weapon    which battery a node's actions and conditions read: "focus" (her focus battery, the one
#             her class is built around), a battery's kind ("stack": the spinal battery; "strip",
#             "dome", "panel", "turret", "cell"). One she lacks is her spine if she has one, else
#             her focus
#   if        "always", "far" (beyond the battery's envelope), "in-envelope", "in-reach" (within its
#             reach: a stack's farthest rated, TELVM §3.7), "lost" (out of her
#             side's picture, or of her stance's range), "gone" (out of the picture), "alive",
#             "destroyed" (destroyed or disabled), "passed" (going away from her after a pass),
#             "focus-stack" (her focus battery is a stack: her class is built on the spine), "fired-on"
#
# An attack-move flies two of these while she is on it (data/minerva.toml attack_keep, attack_pass).
# Keeping station: Standing orders, the root. Passing on by: Ballistic orders. Once the move is
# over she is on her own profile again. She is not told which shot: her focus says it.

[profile.root]
name = "Standing orders"
targets = ["hostile"]
start = "close"

[profile.root.node.close]
label = "Close to station, fire"
do = ["station", "fire", "turn-to-fire"]
weapon = "stack"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "in-envelope", go = "fire" }, { if = "in-reach", go = "close" }]

[profile.root.node.fire]
label = "Fire spinal battery"
do = ["fire", "turn-to-fire"]
weapon = "stack"
on = [{ if = "always", go = "await" }]

[profile.root.node.await]
label = "Await next tick"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "alive", go = "hold" }]

[profile.root.node.hold]
label = "Hold station, fire"
do = ["hold", "fire", "turn-to-fire"]
weapon = "stack"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "far", go = "close" }, { if = "alive", go = "hold" }]

[profile.root.node.lost]
label = "Target lost: hold, wait"
do = ["hold"]
wait_s = 600              # TESTING: a delay before she leaves combat, to see what she does
on = [{ if = "always", go = "exit" }]

[profile.reckless-ahead]
name = "Reckless Ahead"   # Standing orders without turn-to-fire: off the bow under burn, the spine is held
targets = ["hostile"]
start = "close"

[profile.reckless-ahead.node.close]
label = "Close to station, fire"
do = ["station", "fire"]
weapon = "stack"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "in-envelope", go = "fire" }, { if = "in-reach", go = "close" }]

[profile.reckless-ahead.node.fire]
label = "Fire spinal battery"
do = ["fire"]
weapon = "stack"
on = [{ if = "always", go = "await" }]

[profile.reckless-ahead.node.await]
label = "Await next tick"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "alive", go = "hold" }]

[profile.reckless-ahead.node.hold]
label = "Hold station, fire"
do = ["hold", "fire"]
weapon = "stack"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "far", go = "close" }, { if = "alive", go = "hold" }]

[profile.reckless-ahead.node.lost]
label = "Target lost: hold, wait"
do = ["hold"]
wait_s = 600              # TESTING: a delay before she leaves combat, to see what she does
on = [{ if = "always", go = "exit" }]

[profile.artillery]
name = "Artillery orders"   # stand off at her light's dazzle range (strips: 40,000 km) and keep the salvos coming
targets = ["hostile"]
start = "close"

[profile.artillery.node.close]
label = "Close to dazzle range, fire"
do = ["station", "fire", "spine", "turn-to-fire"]
weapon = "strip"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "in-reach", go = "hold" }]

[profile.artillery.node.hold]
label = "Hold off, fire"
do = ["hold", "fire", "spine", "turn-to-fire"]
weapon = "strip"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "alive", go = "hold" }]

[profile.artillery.node.lost]
label = "Target lost: hold, wait"
do = ["hold"]
wait_s = 600              # TESTING: a delay before she leaves combat, to see what she does
on = [{ if = "always", go = "exit" }]

[profile.hold-the-line]
name = "Hold the line"
targets = ["hostile", "unknown"]
start = "close"

[profile.hold-the-line.node.close]
label = "Close to station"
do = ["station"]
on = [{ if = "lost", go = "exit" }, { if = "in-envelope", go = "fire" }]

[profile.hold-the-line.node.fire]
label = "Hold station, fire"
do = ["hold", "fire"]
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "exit" }, { if = "far", go = "close" }, { if = "alive", go = "fire" }]

[profile.pursuit]
name = "Pursuit"
targets = ["hostile", "unknown"]
start = "close"

[profile.pursuit.node.close]
label = "Close to station"
do = ["station"]
weapon = "stack"
on = [{ if = "gone", go = "exit" }, { if = "in-envelope", go = "fire" }]

[profile.pursuit.node.fire]
label = "Keep station, fire"
do = ["station", "fire"]
weapon = "stack"
on = [{ if = "destroyed", go = "exit" }, { if = "gone", go = "exit" }, { if = "far", go = "close" }, { if = "alive", go = "fire" }]

[profile.search-and-destroy]
name = "Search and Destroy"
targets = ["hostile", "unknown"]
after = "coast"           # through her and on: no braking back
start = "pass"

[profile.search-and-destroy.node.pass]
label = "Pass through her"
do = ["pass"]
on = [{ if = "passed", go = "exit" }, { if = "in-envelope", go = "fire" }, { if = "always", go = "run" }]

[profile.search-and-destroy.node.run]
label = "On the run in"
do = ["correct"]
on = [{ if = "passed", go = "exit" }, { if = "in-envelope", go = "fire" }, { if = "always", go = "run" }]

[profile.search-and-destroy.node.fire]
label = "Fire as she passes"
do = ["fire"]
on = [{ if = "passed", go = "exit" }, { if = "always", go = "fire" }]

[profile.ballistic]
name = "Ballistic orders"
targets = ["hostile"]
after = "coast"           # on as she goes: the pass is not braked to a point
start = "close"

[profile.ballistic.node.close]
label = "Close"
do = ["fire"]
weapon = "focus"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "focus-stack", go = "keep" }, { if = "in-reach", go = "coast" }]

[profile.ballistic.node.keep]
label = "Keep the heading, fire"
do = ["fire", "spine", "hold-heading"]
weapon = "focus"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "passed", go = "exit" }, { if = "alive", go = "keep" }]

[profile.ballistic.node.coast]
label = "Coast for the shot, fire"
do = ["fire", "spine"]
weapon = "focus"
on = [{ if = "destroyed", go = "exit" }, { if = "lost", go = "lost" }, { if = "passed", go = "exit" }, { if = "alive", go = "coast" }]

[profile.ballistic.node.lost]
label = "Target lost"
wait_s = 600              # TESTING: a delay before she leaves combat, to see what she does
on = [{ if = "always", go = "exit" }]
