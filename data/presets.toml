# Starting points for the system workshop. Each preset fills a new body's fields; everything
# stays editable after. Values are representative of the class, from well-known examples.
# Add your own: [preset.<id>] with a label, a kind, and any body keys (see data/systems/README.md).

# ---- stars ---------------------------------------------------------------------------------------
[preset.g-dwarf]
label = "G dwarf: Sun-like"
kind = "star"
mass_msun = 1.0
radius_rsun = 1.0
luminosity_lsun = 1.0
teff_k = 5772
display = { role = "star", color = "#ffd27a" }

