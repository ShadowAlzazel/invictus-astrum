# Invictus: Astrum — how the tools run. Never what is true (that is data/) or how it looks (style.toml).
# Every key is required; unknown keys are an error. Paths are relative to this file.

[paths]
systems   = "data/systems"
scenarios = "data/scenarios"
levels    = "data/levels"
users     = "data/users.toml"   # who may sign in (astrum/accounts.py)       # the games: each a clock and the systems (with their scenarios) it is played in
players   = "data/players.toml"
ships     = "data/ships"
style     = "style.toml"
display   = "display.toml"      # display rules and the defaults of every setting
settings  = "settings.toml"     # your settings from the map; overrides display.toml; not committed
bullseyes = "bullseyes.toml"    # bullseyes commanders make on the map; written by the map; not committed
profiles  = "profiles.toml"     # combat profiles commanders make on the map; written by the map; not committed

[server]
host = "127.0.0.1"     # "0.0.0.0": every machine on the network may open the map
port = 8010
auth = true            # sign in (data/users.toml), and every request is made as the lobby grants: its level, your side

[live]
check_seconds = 2      # how often the server looks for edits to data/ and style.toml

[sim]
start = "system"       # "system" = each system's own epoch, "now" = the wall clock, or an ISO UTC date
orbit_samples = 360    # points per drawn orbit
table_days = 60        # body positions worked out up front, from each game's start (the rest as it goes)
run_ahead = true       # a worker keeps the fleet flown ahead of the map's clock; off, each picture flies it there
ai = true              # the AI gives its sides' standing orders, off each side's picture (astrum/ai.py, pictures.py)

[picture]              # what a view is shown, made from the simulation's truth (astrum/picture.py); all off: all of it
                       # (the defaults: the map's Settings, Game, switches them for its own pictures;
                       # every switch, its type and range: astrum/switches.py)
detection = true       # a ship not its own is shown once its own ships' sensors see her, as that light left her
relay = true           # ... once the report has come up to its fleet flagship (off: the moment she is seen)
light_delay = true     # (without detection) a ship not its own is shown as her light reached the nearest of its own
hide_private = true    # ... and what only that ship knows (tanks, orders, store) is not shown
old_days = 7           # a track dropped stays this long as an old track: a point where she was last seen
